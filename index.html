<title>Quiz de uniones · EyCI</title>
<style>
:root{--bg:#f6f7fa;--card:#ffffff;--ink:#141a26;--muted:#5a6477;--rule:#d6dbe5;--navy:#00143c;--accent:#c4551f;--ok:#1a7a43;--ok-bg:#e3f4e9;--ko:#b3261e;--ko-bg:#fbe9e7;--sel:#e6ecf7}
@media (prefers-color-scheme: dark){:root{--bg:#0d1220;--card:#161d2e;--ink:#e7eaf1;--muted:#9ba6ba;--rule:#2b3549;--navy:#00143c;--accent:#ef8a55;--ok:#6fd49a;--ok-bg:#143524;--ko:#ff9a8f;--ko-bg:#3b1a17;--sel:#22304c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Century Gothic","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:18px 20px}
header .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header .t{font-weight:700;font-size:1.15rem}
header .s{color:#a9b7d4;font-size:.85rem}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:10px}
.blk{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
.card{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.q{font-size:1.12rem;font-weight:600;margin:0}
.fig{background:#fff;border:1px solid var(--rule);padding:8px;text-align:center}
.fig img{max-width:100%;max-height:300px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--rule);padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--ink);background:var(--sel)}
.opt.sel .k{background:var(--ink);color:var(--card);border-color:var(--ink)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--ko);background:var(--ko-bg)}
.opt:disabled{cursor:default;opacity:1}
.opt .tx{min-width:0;overflow-x:auto}
.num{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num input{font:inherit;padding:10px 12px;width:140px;border:2px solid var(--rule);background:var(--card);color:var(--ink)}
.fb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-bg)}.fb.ko{background:var(--ko-bg)}
.fb .v{font-weight:700}.fb.ok .v{color:var(--ok)}.fb.ko .v{color:var(--ko)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;padding:12px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer}
.btn.sec{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.score{font-size:3rem;font-weight:700;line-height:1}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left}
.tw{overflow-x:auto}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
footer{font-size:.8rem;color:var(--muted);text-align:center}
body.prof{font-size:23px}
body.prof main,body.prof header .in{max-width:1180px}
body.prof .q{font-size:1.25rem}
body.prof .fig img{max-height:360px}
body.prof .opt{cursor:default}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{font:inherit;font-size:.75rem;font-weight:700;width:2.3em;height:2.3em;border:2px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.nav button.cur{background:var(--ink);color:var(--card);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.qr{background:#fff;padding:14px;display:inline-block}
.url{font-weight:700;word-break:break-all}
.hint{font-size:.8rem;color:var(--muted)}
a{color:var(--accent)}
</style>

const app=document.getElementById('app');
let i=-1, res=[], sel=new Set(), done=false;
const L='ABCDEFGH';
function ts(){ if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([app]).catch(()=>{});} else {setTimeout(ts,300);} }
function h(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}
function start(){
  app.innerHTML='';
  const c=h('section','card');
  c.append(h('p','blk','Antes de empezar'));
  c.append(h('h1','q',Q.length+' preguntas cortas sobre uniones atornilladas, soldadas, bulones y bases de pilar'));
  c.append(h('p','', 'Cada pregunta se corrige al momento y explica por qué. Algunas son de predicción: se contestan antes de ver el cálculo. No se guarda ninguna respuesta.'));
  const r=h('div','row'); const b=h('button','btn','Empezar'); b.onclick=()=>{i=0;res=[];show();}; r.append(b); c.append(r);
  app.append(c);
}
function show(){
  const q=Q[i]; sel=new Set(); done=false; app.innerHTML='';
  const bar=h('div','bar'); const fill=h('i'); fill.style.width=(100*i/Q.length)+'%'; bar.append(fill); app.append(bar);
  app.append(h('div','meta','<span class="blk">'+q.b+'</span><span>Pregunta '+(i+1)+' de '+Q.length+'</span>'));
  const c=h('section','card');
  c.append(h('h1','q',q.q));
  if(q.fq){const f=h('div','fig'); const im=new Image(); im.src=q.fq; im.alt='Esquema de la pregunta'; f.append(im); c.append(f);}
  let check;
  if(q.t==='num'){
    const n=h('div','num'); const inp=h('input'); inp.type='text'; inp.inputMode='decimal'; inp.id='ans'; inp.setAttribute('aria-label','Respuesta en '+q.u);
    n.append(inp,h('span','',q.u)); c.append(n);
    inp.oninput=()=>{check.disabled=inp.value.trim()==='';};
    inp.onkeydown=e=>{if(e.key==='Enter'&&!check.disabled&&!done)check.click();};
  } else {
    const o=h('div','opts');
    q.o.forEach((t,k)=>{const b=h('button','opt','<span class="k">'+L[k]+'</span><span class="tx">'+t+'</span>'); b.type='button';
      b.onclick=()=>{ if(done)return; if(q.t==='multi'){ sel.has(k)?sel.delete(k):sel.add(k);} else {sel=new Set([k]);}
        [...o.children].forEach((x,j)=>{x.classList.toggle('sel',sel.has(j)); x.setAttribute('aria-pressed',sel.has(j));}); check.disabled=sel.size===0; };
      o.append(b);});
    c.append(o);
  }
  const fb=h('div'); c.append(fb);
  const r=h('div','row'); check=h('button','btn','Comprobar'); check.disabled=true; r.append(check); c.append(r);
  check.onclick=()=>{
    if(done){ i++; (i<Q.length)?show():end(); return; }
    let ok;
    if(q.t==='num'){ const inp=document.getElementById('ans'); const v=parseFloat(inp.value.replace(',','.')); ok=Math.abs(v-q.a)<=q.tol; inp.disabled=true; }
    else { ok=sel.size===q.a.length && q.a.every(k=>sel.has(k));
      [...c.querySelectorAll('.opt')].forEach((x,j)=>{x.disabled=true; if(q.a.includes(j))x.classList.add('good'); else if(sel.has(j))x.classList.add('bad');}); }
    res.push(ok); done=true;
    fb.className='fb '+(ok?'ok':'ko');
    fb.innerHTML='<span class="v">'+(ok?'Correcto.':'No es correcto.')+'</span><span>'+q.e+'</span>';
    if(q.fe){const f=h('div','fig'); const im=new Image(); im.src=q.fe; im.alt='Esquema de la explicación'; f.append(im); fb.append(f);}
    check.textContent=(i+1<Q.length)?'Siguiente':'Ver resultado'; check.disabled=false; check.focus(); ts();
  };
  app.append(c); ts(); window.scrollTo(0,0);
}
function end(){
  app.innerHTML='';
  const n=res.filter(Boolean).length;
  const c=h('section','card');
  c.append(h('p','blk','Resultado'));
  c.append(h('div','score',n+' / '+Q.length));
  const blocks={}; Q.forEach((q,k)=>{(blocks[q.b]=blocks[q.b]||[0,0]); blocks[q.b][1]++; if(res[k])blocks[q.b][0]++;});
  let t='<div class="tw"><table><thead><tr><th>Bloque</th><th>Aciertos</th></tr></thead><tbody>';
  for(const b in blocks) t+='<tr><td>'+b+'</td><td>'+blocks[b][0]+' de '+blocks[b][1]+'</td></tr>';
  c.append(h('div','',t+'</tbody></table></div>'));
  const fails=Q.map((q,k)=>res[k]?null:(k+1)).filter(Boolean);
  c.append(h('p','', fails.length?('Preguntas para repasar: '+fails.join(', ')+'.'):'Todas correctas.'));
  const r=h('div','row'); const b=h('button','btn sec','Repetir'); b.onclick=()=>{i=0;res=[];show();}; r.append(b); c.append(r);
  app.append(c); window.scrollTo(0,0);
}
// ---------- Modo profesor: se abre añadiendo #profesor a la dirección
const PROF=location.hash.toLowerCase()==='#profesor';
const BASE=location.origin+location.pathname;
function profStart(){
  i=-1; app.innerHTML='';
  const c=h('section','card');
  c.append(h('p','blk','Modo profesor'));
  c.append(h('h1','q','Entrad con el móvil y contestad a vuestro ritmo'));
  const two=h('div','two'); const left=h('div'); const right=h('div');
  const web=location.protocol.startsWith('http');
  if(web && window.QRCode){ const q=h('div','qr'); new QRCode(q,{text:BASE,width:300,height:300}); left.append(q); }
  right.append(h('p','url',web?BASE:'La dirección y el código QR aparecen cuando la página está publicada en GitHub Pages.'));
  right.append(h('p','',Q.length+' preguntas. Cada una se corrige al momento y explica por qué.'));
  right.append(h('p','hint','Teclas: flecha derecha e izquierda para cambiar de pregunta; barra espaciadora para mostrar la respuesta.'));
  two.append(left,right); c.append(two);
  const r=h('div','row'); const b=h('button','btn','Empezar a proyectar'); b.onclick=()=>profShow(0); r.append(b); c.append(r);
  app.append(c);
}
function profShow(k){
  i=k; done=false; const q=Q[i]; app.innerHTML='';
  const nav=h('div','nav'); Q.forEach((_,j)=>{const b=h('button',j===i?'cur':'',String(j+1)); b.setAttribute('aria-label','Pregunta '+(j+1)); b.onclick=()=>profShow(j); nav.append(b);}); app.append(nav);
  app.append(h('div','meta','<span class="blk">'+q.b+'</span><span>Pregunta '+(i+1)+' de '+Q.length+'</span>'));
  const c=h('section','card');
  c.append(h('h1','q',q.q));
  if(q.fq){const f=h('div','fig'); const im=new Image(); im.src=q.fq; im.alt='Esquema de la pregunta'; f.append(im); c.append(f);}
  if(q.t!=='num'){ const o=h('div','opts'); q.o.forEach((t,j)=>{const b=h('div','opt','<span class="k">'+L[j]+'</span><span class="tx">'+t+'</span>'); o.append(b);}); c.append(o); }
  else c.append(h('p','hint','Respuesta numérica, en '+q.u+'.'));
  const fb=h('div'); fb.id='pfb'; c.append(fb);
  const r=h('div','row');
  const prev=h('button','btn sec','Anterior'); prev.disabled=i===0; prev.onclick=()=>profShow(i-1);
  const rev=h('button','btn','Mostrar respuesta'); rev.id='rev'; rev.onclick=profReveal;
  const next=h('button','btn sec','Siguiente'); next.disabled=i===Q.length-1; next.onclick=()=>profShow(i+1);
  r.append(prev,rev,next); c.append(r);
  app.append(c); ts(); window.scrollTo(0,0);
}
function profReveal(){
  if(done||i<0) return; done=true; const q=Q[i]; const fb=document.getElementById('pfb');
  if(q.t!=='num') [...app.querySelectorAll('.opt')].forEach((x,j)=>{ if(q.a.includes(j)) x.classList.add('good'); });
  const ans=q.t==='num' ? (String(q.a).replace('.',',')+' '+q.u) : q.a.map(j=>L[j]).join(', ');
  fb.className='fb ok';
  fb.innerHTML='<span class="v">Respuesta: '+ans+'</span><span>'+q.e+'</span>';
  if(q.fe){const f=h('div','fig'); const im=new Image(); im.src=q.fe; im.alt='Esquema de la explicación'; f.append(im); fb.append(f);}
  document.getElementById('rev').disabled=true; ts();
}
if(PROF){
  document.body.classList.add('prof');
  document.querySelector('header .t').textContent='Uniones · quiz en directo';
  document.addEventListener('keydown',e=>{
    if(i<0){ if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();profShow(0);} return; }
    if(e.key==='ArrowRight'&&i<Q.length-1) profShow(i+1);
    else if(e.key==='ArrowLeft'&&i>0) profShow(i-1);
    else if(e.key===' '){ e.preventDefault(); profReveal(); }
  });
  profStart();
} else start();
window.addEventListener('hashchange',()=>location.reload());
</script>
